x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

version: "3.9"

services:
  frontend:
    image: "ghcr.io/chheangg/karas-frontend:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Bind mounts (not named volumes) so the deploy's `docker system prune --volumes`
      # can't wipe the issued certs / ACME account. ./caddy/data is the important one.
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      - nginx_network
    logging: *default-logging

networks:
  nginx_network:
    external: true
